{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<h1>Login</h1><form method="post" class="card card-body">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary">Login</button></form>
<p class="mt-3">No account? <a href="{% url 'register' %}">Register</a></p>
</div></div></div>
{% endblock %}
