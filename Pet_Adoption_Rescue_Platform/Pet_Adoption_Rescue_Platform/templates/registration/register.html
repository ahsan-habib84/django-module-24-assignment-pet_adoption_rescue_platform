{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<h1>Create Account</h1><form method="post" class="card card-body">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success">Register</button></form>
<p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div></div></div>
{% endblock %}
